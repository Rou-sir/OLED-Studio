name: Publish OLED Studio

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  pages:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site
        shell: bash
        run: |
          mkdir -p _site
          cp dist/oled-studio.html _site/index.html
          cp dist/*-LICENSE.txt _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Package offline release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/package_release.py "$RELEASE_TAG"
      - name: Publish release and assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" \
            "release/oled-studio-$RELEASE_TAG.zip" \
            dist/oled-studio.html \
            --verify-tag --generate-notes --title "OLED Studio $RELEASE_TAG"
